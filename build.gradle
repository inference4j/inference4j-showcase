plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

// inference4j straight from main, built by JitPack: https://jitpack.io/#inference4j/inference4j
// To test a local build instead: run `./gradlew publishToMavenLocal -x test` in inference4j,
// then pass -Pinference4jLocal here (optionally -Pinference4jLocalVersion=x.y.z).
def useLocalInference4j = project.hasProperty('inference4jLocal')
ext.inference4jGroup = useLocalInference4j ? 'io.github.inference4j' : 'com.github.inference4j.inference4j'
ext.inference4jVersion = useLocalInference4j ? (findProperty('inference4jLocalVersion') ?: '0.15.0') : 'main-SNAPSHOT'

group = 'net.inference4j'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	if (useLocalInference4j) {
		mavenLocal()
	}
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

// Always resolve the latest commit on inference4j main instead of Gradle's 24-hour snapshot cache
configurations.configureEach {
	resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	implementation "${inference4jGroup}:inference4j-spring-boot-starter:${inference4jVersion}"
	implementation("${inference4jGroup}:inference4j-genai:${inference4jVersion}") {
		exclude group: 'org.slf4j', module: 'slf4j-nop'
	}
	// RAG assistant examples: inference4j models behind LangChain4j interfaces
	implementation "${inference4jGroup}:inference4j-langchain4j:${inference4jVersion}"
	implementation 'dev.langchain4j:langchain4j:1.23.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

springBoot {
	mainClass = 'net.inference4j.showcase.Inference4jShowcaseApplication'
}

tasks.named('bootRun') {
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}
