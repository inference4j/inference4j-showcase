<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text — inference4j showcase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="/" class="back-link">&larr; All demos</a>
      <h1>Speech to Text</h1>
      <p>Transcribe speech from WAV files using Wav2Vec2 or Whisper.</p>
    </header>

    <section class="demo-section">
      <div class="card">
        <label for="audio-input">Upload a WAV file <span class="text-muted">(max 4 MB)</span></label>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="audio-input" accept=".wav,audio/wav" hidden>
          <p class="drop-zone-text">Drop a WAV file here or <button type="button" class="link-btn" id="browse-btn">browse</button></p>
          <div id="audio-preview" class="audio-preview" hidden>
            <span id="file-name" class="file-name"></span>
            <audio id="player" controls></audio>
          </div>
          <button type="button" class="clear-btn" id="clear-btn" hidden>&times;</button>
        </div>

        <div style="margin-top: 1rem;">
          <label for="model-select">Model</label>
          <select id="model-select" class="select">
            <option value="wav2vec2">Wav2Vec2 — raw output</option>
            <option value="wav2vec2-punctuated">Wav2Vec2 + punctuation &amp; casing (PunctuatedSpeechRecognizer)</option>
            <option value="whisper">Whisper small (inference4j-genai)</option>
          </select>
          <p class="text-muted" id="model-hint" hidden style="margin-top: 0.5rem;">
            Whisper punctuates and capitalizes on its own. The first request downloads the model (~1.1 GB).
          </p>
        </div>

        <div class="actions">
          <button class="btn" id="transcribe-btn" disabled>Transcribe</button>
          <div class="spinner" id="spinner"></div>
          <span class="error-msg" id="error"></span>
        </div>
      </div>

      <div class="card" id="results">
        <label>Transcription <span class="text-muted" id="timing"></span></label>
        <p id="transcription" class="transcription-text"></p>
        <div id="raw-section" hidden style="margin-top: 1rem;">
          <label>Raw Wav2Vec2 output <span class="text-muted">(for comparison)</span></label>
          <p id="raw-transcription" class="transcription-text"></p>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <a href="https://github.com/inference4j/inference4j">inference4j</a> &mdash; AI inference for Java
    </footer>
  </div>

  <script src="/js/speech-to-text.js"></script>
</body>
</html>
